version: '3.8'

services:
  flacdl:
    build: .
    container_name: flacdl-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bot_data.sqlite3
      - TEMP_DOWNLOAD_DIR=/tmp/flacdl_bot
    volumes:
      - ./data:/app/data
      - lucida-session:/root/.local/share/lucidadl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lucida-session:
    name: flacdl_session_data
